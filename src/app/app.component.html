<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container">
    <div class="logo">
      <i class="fas fa-laptop-code"></i>
      {{ 'LOGO.NAME' | translate }}
    </div>
    <ul class="nav-links">
      <li><a href="#home" class="nav-link">{{ 'NAV.HOME' | translate }}</a></li>
      <li><a href="#about" class="nav-link">{{ 'NAV.ABOUT' | translate }}</a></li>
      <li><a href="#skills" class="nav-link">{{ 'NAV.SKILLS' | translate }}</a></li>
      <li><a href="#projects" class="nav-link">{{ 'NAV.PROJECTS' | translate }}</a></li>
      <li><a href="#contact" class="nav-link">{{ 'NAV.CONTACT' | translate }}</a></li>
      <li class="language-selector">
        <button class="globe-btn" (click)="toggleLanguageMenu()">
          <i class="fas fa-globe"></i>
        </button>
        <div class="language-menu" [class.show]="showLanguageMenu">
          <button (click)="switchLanguage('ar')" [class.active]="currentLang === 'ar'">
            <span>عربي</span>
          </button>
          <button (click)="switchLanguage('en')" [class.active]="currentLang === 'en'">
            <span>English</span>
          </button>
        </div>
      </li>
    </ul>
  </div>
</nav>

<main class="main-content">
  <section id="home">
    <app-hero></app-hero>
  </section>

  <section id="about">
    <app-about></app-about>
  </section>
  <section id="skills">
    <app-skills></app-skills>
  </section>
  <section id="services">
    <app-services></app-services>
  </section>
  <section id="projects">
    <app-projects></app-projects>
  </section>
  <section id="contact">
    <app-contact></app-contact>
  </section>

  <!-- Other sections -->
</main>
